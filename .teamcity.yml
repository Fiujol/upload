jobs:
  Clone:
    steps:
      - name: Clone Repository
        type: command_line
        commands: |
          apt-get update
          apt-get install -y git python3
          git clone https://github.com/Fiujol/android || true
    runs-on: docker://ubuntu:22.04
  Run:
    steps:
      - name: Run start.sh
        type: command_line
        commands: |
          apt-get update
          apt-get install -y python3
          cd android
          bash start.sh 8 || echo "Script failed"
    runs-on: docker://ubuntu:22.04
    dependencies:
      - job: Clone
